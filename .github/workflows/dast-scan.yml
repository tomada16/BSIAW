name: DAST Scan

on: [push, workflow_dispatch]

jobs:
  security_scan:
    runs-on: ubuntu-latest
    name: OWASP ZAP Scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- DIAGNOSTYKA (To nam powie prawdę) ---
      - name: DEBUG - Check Context File
        run: |
          echo "=== LISTING ==="
          ls -la
          echo "=== CONTENT OF zap.context ==="
          cat zap.context || echo "FILE MISSING!"
      # -----------------------------------------

      - name: Start Environment
        run: |
          docker compose -f docker/compose.yaml up -d --build
          echo "waiting for services to start..."
          sleep 60

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.10.0
        continue-on-error: true
        with:
          target: 'https://localhost:7708'
          # ZMIANA: Dodano pełną ścieżkę /zap/wrk/ przed nazwą pliku
          # Docker montuje Twój kod w /zap/wrk/, więc to jest pewny adres.
          cmd_options: '-a -I -j -n /zap/wrk/zap.context -U 1'
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_scan_reports
          path: |
            report_json.json
            report_md.md
            report_html.html
          overwrite: true
