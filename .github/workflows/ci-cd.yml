name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  AWS_REGION: eu-north-1
  ECR_URL: 139073842005.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPO: tomada16/bsiaw

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & tag the docker image
        run: |
          docker build -t tomada16/bsiaw .
          docker tag "tomada16/bsiaw:latest" "${{ env.ECR_URL }}/${{ env.ECR_REPO }}:latest"

      - name: Push to ECR
        run: |
          docker push "${{ env.ECR_URL }}/${{ env.ECR_REPO }}:latest"

      - name: Redeploy ECS containers
        run: |
          aws ecs update-service --cluster bsiaw --service bsiaw-webserver-service-fldtkco7 \
            --force-new-deployment
